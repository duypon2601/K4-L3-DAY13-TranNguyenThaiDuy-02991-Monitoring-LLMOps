alerts:
  - name: high_latency_p95
    severity: P2
    condition: p95(latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-llmops-alerts"
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: P1
    condition: count(event == "request_failed") / count(event == "request_received") > 0.02
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-llmops-alerts"
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-2
  - name: cost_budget_burn
    severity: P3
    condition: hourly sum(cost_usd) > 2 * baseline or projected_daily > 2.5
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-llmops-alerts"
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-3
